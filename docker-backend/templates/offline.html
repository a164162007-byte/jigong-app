<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>离线 - 记工App</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f5f5f5; margin: 0; }
        .offline-box { text-align: center; padding: 40px; }
        .offline-icon { width: 80px; height: 80px; margin-bottom: 20px; color: #999; }
        h1 { font-size: 24px; color: #333; margin-bottom: 12px; }
        p { color: #666; font-size: 14px; margin-bottom: 24px; }
        .btn { display: inline-block; padding: 12px 24px; background: #2196F3; color: white; border: none; border-radius: 6px; font-size: 14px; text-decoration: none; cursor: pointer; }
        .btn:hover { background: #1976D2; }
    </style>
</head>
<body>
    <div class="offline-box">
        <svg class="offline-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M23.64 7c-.45-.34-4.93-4-11.64-4C5.28 3 .81 6.66.36 7l10.08 12.56c.8 1 2.32 1 3.12 0L23.64 7zm-6.6 5.94L9.73 5.63l1.88-1.88 7.33 7.31-1.9 1.88z"/>
        </svg>
        <h1>网络连接不可用</h1>
        <p>请检查您的网络连接后重试</p>
        <button class="btn" onclick="location.reload()">重新加载</button>
    </div>
</body>
</html>
