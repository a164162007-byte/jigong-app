version: '3.8'

services:
  work-app:
    image: ghcr.io/a164162007-byte/jigong-app:latest
    container_name: work-record-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # 使用 Docker 命名卷，自动创建和管理，无需手动 mkdir
      - app-data:/app/data
      - app-backups:/app/backups
    environment:
      - TZ=Asia/Shanghai
      - DATABASE_PATH=/app/data/work_records.db
      - BACKUP_DIR=/app/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Docker 命名卷 - 容器启动时自动创建
volumes:
  app-data:
    name: jigong-data
  app-backups:
    name: jigong-backups

networks:
  default:
    name: work-app-network
