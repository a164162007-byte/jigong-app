version: '3.8'

services:
  work-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: work-record-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # 持久化数据库
      - ./data:/app/data
      # 持久化备份
      - ./backups:/app/backups
    environment:
      - TZ=Asia/Shanghai
      - DATABASE_PATH=/app/data/work_records.db
      - BACKUP_DIR=/app/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    name: work-app-network
